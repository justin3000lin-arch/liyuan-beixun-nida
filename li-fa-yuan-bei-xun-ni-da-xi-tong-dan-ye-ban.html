<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>國土處立法院擬答系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet" />
<style>
:root {
color-scheme: light dark;
--bg: #f4f4f1;
--card: #ffffff;
--card-2: #eceee9;
--ink: #1d2530;
--ink-2: #46505d;
--muted: #79828d;
--line: #dddcd4;
--accent: #93312a;
--accent-ink: #7e2a24;
--accent-soft: #f7e9e6;
--gold: #8a6d1f;
--gold-soft: #f4ecd4;
--ok: #2e6b4f;
--ok-soft: #e3efe7;
--sheet-bg: #fbfbfa;
--shadow: 0 1px 2px rgba(29,37,48,.06), 0 8px 24px -18px rgba(29,37,48,.35);
--radius: 14px;
}
@media (prefers-color-scheme: dark) {
:root {
--bg: #12151a;
--card: #1c212a;
--card-2: #242b36;
--ink: #edf0f4;
--ink-2: #c3cad4;
--muted: #8d97a4;
--line: #2e3642;
--accent: #e08a7a;
--accent-ink: #eda696;
--accent-soft: #3a2723;
--gold: #d3b264;
--gold-soft: #38301c;
--ok: #7fc7a2;
--ok-soft: #1f3229;
--sheet-bg: #171b21;
--shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}
}
* { box-sizing: border-box;}
html { -webkit-text-size-adjust: 100%;}
body {
margin: 0;
background: var(--bg);
color: var(--ink);
font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
font-size: 18px;
line-height: 1.65;
}
button, input { font: inherit; color: inherit;}
button { cursor: pointer;}

.page-head { padding: calc(18px + env(safe-area-inset-top)) 2px 4px;}
.page-title {
font-family: "Noto Serif TC", serif; font-weight: 900;
font-size: 27px; line-height: 1.3; letter-spacing:.02em; margin: 0;
}
@media (min-width: 900px) {.page-title { font-size: 30px;}}
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom));}
@media (min-width: 900px) {.wrap { max-width: 880px;}}

/* ── 頂部搜尋 ─────────────────────────── */
.topbar {
position: sticky; top: 0; z-index: 40;
background: color-mix(in srgb, var(--bg) 88%, transparent);
backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
margin: 0 -16px;
border-bottom: 1px solid var(--line);
}
.searchbox { position: relative; max-width: 680px; margin: 0 auto;}
@media (min-width: 900px) {.searchbox { max-width: 880px;}}
.searchbox svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; stroke: var(--muted); pointer-events: none;}
#searchInput {
width: 100%; min-height: 48px;
padding: 10px 48px 10px 42px;
border: 1px solid var(--line); border-radius: 999px;
background: var(--card); color: var(--ink);
font-size: 18px; outline: none;
box-shadow: var(--shadow);
}
#searchInput:focus { border-color: var(--accent);}
#searchInput::placeholder { color: var(--muted);}
#clearSearch {
position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
width: 38px; height: 38px; border: 0; border-radius: 999px;
background: var(--card-2); color: var(--ink-2);
font-size: 20px; line-height: 1; display: none;
}
.searchbox.has-q #clearSearch { display: block;}

/* ── 分頁籤 ─────────────────────────── */
.tabs {
display: flex; gap: 6px; max-width: 680px; margin: 12px auto 0;
}
@media (min-width: 900px) {.tabs { max-width: 880px;}}
.tab {
flex: 1; min-height: 44px; border: 1px solid var(--line);
background: var(--card); color: var(--ink-2);
border-radius: 999px; font-weight: 700; font-size: 17px;
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink);}

main { padding-top: 18px;}
.view { display: none;}
.view.active { display: block;}

h2.sec {
font-family: "Noto Serif TC", serif; font-weight: 900;
font-size: 23px; margin: 26px 0 12px; letter-spacing:.02em;
display: flex; align-items: baseline; gap: 10px;
scroll-margin-top: 150px;
}
h2.sec:first-child { margin-top: 4px;}
h2.sec.count { font-family: "Noto Sans TC", sans-serif; font-size: 15px; font-weight: 500; color: var(--muted);}
.lede { color: var(--ink-2); font-size: 17px; margin: 0 0 6px;}

/* ── 統計 ─────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;}
.stat {
background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
padding: 12px 6px 10px; text-align: center; box-shadow: var(--shadow);
}
button.stat {
font: inherit; color: inherit; width: 100%; cursor: pointer;
-webkit-tap-highlight-color: transparent;
}
button.stat:active { transform: scale(.98);}
button.stat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px;}
@media (hover: hover) { button.stat:hover b { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px;}}
.stat b { display: block; font-size: 30px; font-weight: 900; line-height: 1.15; font-variant-numeric: tabular-nums;}
.stat span { font-size: 14px; color: var(--muted);}
.stat span .arr { color: var(--accent-ink); font-weight: 700;}
.stat.hot b { color: var(--accent-ink);}


/* ── 頂端小 icon：類別 ── */
.icon-top {
background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
box-shadow: var(--shadow); padding: 14px 14px 6px;
}
.icon-group { margin-bottom: 10px;}
.icon-group-label { font-size: 14px; font-weight: 900; letter-spacing:.12em; color: var(--muted); margin-bottom: 8px;}
.icon-grid { display: grid; gap: 6px;}
.icon-grid-cat { grid-template-columns: repeat(3, 1fr);}
.icon-btn {
display: flex; flex-direction: column; align-items: center; gap: 5px;
border: 0; background: transparent; border-radius: 10px;
padding: 8px 2px 7px; min-height: 64px; color: var(--ink);
}
.icon-btn:active { background: var(--card-2);}
.icon-btn[aria-pressed="true"] .ic { background: var(--accent-soft); color: var(--accent-ink);}
.icon-btn .ic {
width: 46px; height: 46px; border-radius: 999px; flex: 0 0 auto;
background: var(--card-2); color: var(--ink-2);
display: flex; align-items: center; justify-content: center;
}
.icon-btn .ic svg { width: 24px; height: 24px;}
.icon-btn .lb { font-size: 15px; font-weight: 700; line-height: 1.3; text-align: center;}
.icon-btn .ct { font-size: 13px; color: var(--muted); line-height: 1; font-variant-numeric: tabular-nums;}
.chip .mini, .qmeta .mini, .tagchip .mini { display: inline-flex; vertical-align: -2px; margin-right: 3px;}
.chip .mini svg, .qmeta .mini svg, .tagchip .mini svg { width: 12px; height: 12px;}

/* ── 圖卡 ─────────────────────────── */
.cards { display: grid; gap: 10px;}
@media (min-width: 900px) {.cards.two { grid-template-columns: 1fr 1fr;}}
.qcard {
display: block; width: 100%; text-align: left;
background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
padding: 14px 16px 12px; box-shadow: var(--shadow);
}
.qcard:active { transform: scale(.995);}
.qtop { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px;}
.chip {
font-size: 13.5px; font-weight: 700; line-height: 1;
padding: 5px 9px; border-radius: 999px;
background: var(--card-2); color: var(--ink-2);
}
.chip.pri-high { background: var(--accent-soft); color: var(--accent-ink);}
.chip.match { background: var(--gold-soft); color: var(--gold);}
.qtitle {
font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 20px; line-height: 1.5;
display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.qshort {
color: var(--ink-2); font-size: 16px; margin-top: 6px;
display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.qmeta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 15px; color: var(--muted);}
.qmeta b { color: var(--ink-2); font-weight: 500;}

/* ── 類別篩選提示（擬答清單內）── */
.filter-note {
display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
margin-top: 12px; padding: 10px 14px;
background: var(--accent-soft); border-radius: var(--radius);
color: var(--accent-ink); font-size: 16px; font-weight: 700;
}
.filter-note button {
margin-left: auto; min-height: 38px; padding: 6px 14px;
border: 1px solid var(--accent-ink); border-radius: 999px;
background: transparent; color: var(--accent-ink); font-weight: 700; font-size: 15px;
}

/* ── 委員卡 ─────────────────────────── */
.lcard {
display: block; width: 100%; text-align: left;
background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
padding: 14px 16px; box-shadow: var(--shadow);
}
.lname { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 22px; display: inline;}
.lcom { font-size: 15px; color: var(--muted); margin-left: 8px;}
.lfocus { color: var(--ink-2); font-size: 16px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
.lmeta { margin-top: 8px; font-size: 15px; color: var(--muted);}

/* ── 詳情 Sheet ─────────────────────────── */
.sheet {
position: fixed; inset: 0; z-index: 60; display: none;
background: var(--sheet-bg);
overflow-y: auto; overscroll-behavior: contain;
-webkit-overflow-scrolling: touch;
}
.sheet.open { display: block;}
.sheet-in { max-width: 680px; margin: 0 auto; padding: 0 16px calc(48px + env(safe-area-inset-bottom));}
@media (min-width: 900px) {.sheet-in { max-width: 760px;}}
.sheet-bar {
position: sticky; top: 0; z-index: 5;
display: flex; align-items: center; gap: 10px;
padding: calc(10px + env(safe-area-inset-top)) 0 10px;
background: color-mix(in srgb, var(--sheet-bg) 90%, transparent);
backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.backbtn {
min-height: 44px; padding: 8px 16px 8px 12px; border: 1px solid var(--line);
border-radius: 999px; background: var(--card); font-weight: 700; font-size: 17px;
display: inline-flex; align-items: center; gap: 4px;
}
.sheet-bar.where { font-size: 15px; color: var(--muted); margin-left: auto; text-align: right;}
.sheet h1 {
font-family: "Noto Serif TC", serif; font-weight: 900;
font-size: 27px; line-height: 1.45; margin: 14px 0 10px;
}
.block { margin-top: 22px;}
.block > h3 {
font-size: 15px; font-weight: 900; letter-spacing:.14em;
color: var(--accent-ink); margin: 0 0 8px;
display: flex; align-items: center; gap: 8px;
}
.block > h3::after { content: ""; flex: 1; height: 1px; background: var(--line);}
.block.body {
background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
padding: 14px 16px; font-size: 18px; white-space: pre-wrap; word-break: break-word;
}
.block.lead.body { font-size: 19.5px; font-weight: 500; border-left: 4px solid var(--accent);}
.seg { margin-bottom: 12px;}
.seg:last-child { margin-bottom: 0;}
.seg b.tag {
display: inline-block; font-size: 14px; font-weight: 900;
background: var(--accent-soft); color: var(--accent-ink);
border-radius: 6px; padding: 3px 8px; margin-bottom: 5px;
}
.seg p { margin: 0;}
.bullets { margin: 4px 0 0; padding-left: 1.3em; list-style: disc;}
.bullets li { margin-bottom: 6px; line-height: 1.55;}
.bullets li:last-child { margin-bottom: 0;}
.bullets li::marker { color: var(--accent-ink); font-size: .85em;}
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;}
.tagchip { font-size: 15px; padding: 7px 12px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); border: 0; min-height: 40px;}
button.tagchip { font-weight: 700;}
.src { margin-top: 26px; font-size: 15px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px;}
.relq { display: grid; gap: 8px;}

.empty {
text-align: center; color: var(--muted); padding: 44px 20px;
background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius);
font-size: 17px;
}
.foot { margin-top: 34px; font-size: 14px; color: var(--muted); text-align: center; line-height: 1.7;}
.hidden { display: none!important;}

/* ── 回到首頁（固定按鈕，所有頁面與詳情頁都顯示）── */
.homebtn {
position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 200;
display: inline-flex; align-items: center; gap: 6px;
min-height: 50px; padding: 10px 18px 10px 14px;
border: 1px solid var(--ink); border-radius: 999px;
background: var(--ink); color: var(--bg);
font-weight: 700; font-size: 16px; line-height: 1;
box-shadow: 0 6px 20px -6px rgba(29,37,48,.45);
}
.homebtn svg { width: 21px; height: 21px; flex: 0 0 auto;}
.homebtn:active { transform: scale(.97);}
</style>
</head>
<body>
<div class="wrap">
<header class="page-head">
<h1 class="page-title">國土處立法院擬答系統</h1>
</header>
<div class="topbar">
<div class="searchbox" id="searchbox">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
<input id="searchInput" type="search" inputmode="search" autocomplete="off"
placeholder="查委員、地區、項目、政策" aria-label="搜尋委員、地區、重大公建項目、行政院重大政策" />
<button id="clearSearch" type="button" aria-label="清除搜尋">✕</button>
</div>
<nav class="tabs" role="tablist" aria-label="主要分頁">
<button class="tab" role="tab" data-tab="home" aria-selected="true">擬答清單</button>
<button class="tab" role="tab" data-tab="people" aria-selected="false">委員</button>
</nav>
</div>

<main>
<!-- 擬答清單 -->
<section class="view active" id="view-home">
<div class="icon-top" aria-label="依類別快速進入">
<div class="icon-group">
<div class="icon-group-label">類別</div>
<div class="icon-grid icon-grid-cat" id="catIcons"></div>
</div>
</div>

<div class="filter-note hidden" id="topicNote"></div>

<h2 class="sec" id="hotHead">高關注題目 <span class="count">先看這幾題</span></h2>
<div class="cards" id="hotList"></div>

<h2 class="sec">其餘題目 <span class="count" id="restCount"></span></h2>
<div class="cards" id="restList"></div>

<h2 class="sec">案件統計</h2>
<div class="stats" id="stats"></div>

<p class="foot">資料來源：國土處模擬題庫&#12304;主委版&#12305;115-10-12<br />本頁為單頁閱讀版，內容於建置時匯入，後續更新以原始題庫為準。</p>
</section>

<!-- 委員 -->
<section class="view" id="view-people">
<p class="lede">點委員看關注議題與擬答。黨籍、質詢風格等欄位，原始檔案未提供者留空不補。</p>
<div class="cards two" id="lList"></div>
</section>

<!-- 搜尋結果 -->
<section class="view" id="view-search">
<h2 class="sec">搜尋結果 <span class="count" id="searchCount"></span></h2>
<div id="searchResults"></div>
</section>
</main>
</div>

<!-- 回到首頁 -->
<button class="homebtn" id="homeBtn" type="button" aria-label="回到首頁">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
首頁
</button>

<!-- 題目詳情 -->
<div class="sheet" id="qSheet" role="dialog" aria-modal="true">
<div class="sheet-in">
<div class="sheet-bar">
<button class="backbtn" type="button" data-close>‹ 返回</button>
<div class="where" id="qSheetWhere"></div>
</div>
<div id="qSheetBody"></div>
</div>
</div>

<!-- 委員詳情 -->
<div class="sheet" id="lSheet" role="dialog" aria-modal="true">
<div class="sheet-in">
<div class="sheet-bar">
<button class="backbtn" type="button" data-close>‹ 返回</button>
<div class="where">委員檔案</div>
</div>
<div id="lSheetBody"></div>
</div>
</div>

<script>
const QUESTIONS=[{"id": 1, "topic": "公共建設", "q": "淡海輕軌運輸系統八里延伸線（八里輕軌）可行性研究辦理情形？（洪孟楷委員）", "leg": "洪孟楷", "pri": "中", "short": "本計畫與淡海輕軌藍海線第二期串聯，提供八里、淡水端通勤與觀光運輸需求，有其需求性；但營運模式與藍海線第二期串聯，若二期無法施作將不具興建效益，宜俟淡海輕軌第二期路網修正計畫核定後再行提報。", "std": "【立場】本計畫與淡海輕軌藍海線第二期串聯，提供八里、淡水端通勤與觀光運輸需求，八里及淡水將形成觀光運輸廊帶，有其需求性；但須俟淡海輕軌修正計畫核定後再行提報。【辦理歷程】路線自淡海輕軌V26站（淡水漁人碼頭站）起，經淡江大橋至台64線附近，全長5.6公里、平面輕軌、7座車站（淡水端1座、八里端6座）；總經費80.38億元（中央29.77億元、新北市50.61億元），預估綜合規劃核定後6年通車；行政院秘書長113年1月31日函請交通部修正；113年2月至115年7月交通部5次函請新北市修正，最新為115年7月29日函請修正，目前新北市修正中。【結論】本案營運模式與藍海線第二期串聯，若二期無法施作將不具興建效益，宜俟淡海輕軌第二期路網修正計畫核定後再行提報。", "ext": "路線自淡海輕軌V26站（淡水漁人碼頭站）起，經淡江大橋跨越淡水河，沿八里區博物館路、商港三路、商港一路至台64線附近，全長5.6公里，平面輕軌，7座車站（淡水端1座、八里端6座）；總經費80.38億元（中央29.77億元、新北市50.61億元），預估綜合規劃核定後6年通車。審議歷程：交通部109年5月8日、110年10月25日兩度陳報行政院，行政院秘書長109年8月6日、111年2月18日函請修正；交通部111年8月22日第3次陳報，本會111年10月21日函請修正，112年3月13日交通部再送，本會112年4月24日再函請修正，112年7月25日交通部再送，本會113年1月22日函復行政院。重要審議意見：目標年130年僅積極情境假日尖峰最大站間運量2,560人次/小時略高於輕軌門檻2,500，中估情境僅630–960人次，運量顯不足；八里端6站間距僅600–650公尺，V31–V35未規劃場站開發，應評估設站必要性；應改以中估情境重算經濟及財務效益；票箱收入減10%或維修成本增10%時經營比小於1，財務風險偏高；駐車廠2.7億元與淡海輕軌修正計畫疑似重複編列；營運模式與藍海線第二期串聯，若二期無法施作將不具興建效益，宜俟淡海輕軌修正計畫核定後再提報。行政院秘書長113年1月31日函請交通部修正；新北市113年7月15日、11月11日、114年4月28日、10月16日四度修正再報，交通部鐵道局113年8月16日、12月30日、114年6月16日、115年7月29日函請再修正（其中駐車廠費用已刪除），目前新北市修正中。", "data": "全長5.6公里、7座車站；總經費80.38億元（中央29.77億、新北50.61億）；綜規核定後6年通車", "risk": "目標年130年僅積極情境假日尖峰最大站間運量2,560人次/小時略高於輕軌門檻2,500，中估情境僅630–960人次，運量顯不足；八里端6站間距僅600–650公尺，V31–V35未規劃場站開發；票箱收入減10%或維修成本增10%時經營比小於1，財務風險偏高；駐車廠2.7億元重複編列疑慮（後已刪除）；與藍海線第二期連動", "forb": "", "region": "新北淡水八里", "project": "八里輕軌", "policy": "", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 2, "topic": "公共建設", "q": "臺北市蔣市長提出松山機場遷建議題，國發會看法如何？", "leg": "", "pri": "高", "short": "松山機場為國家重要關鍵基礎設施且軍民合用，遷建議題涉及國防、救災醫療、國際民航、離島及東部運輸，不能僅由單一城市觀點考量，後續宜由交通部洽各部會進一步審慎評估。", "std": "【立場】松山機場為國家重要關鍵基礎設施且軍民合用，遷建議題涉及國防、救災醫療、國際民航、離島及東部運輸，不能僅由單一城市觀點考量。【辦理歷程】國防—空軍松山基地指揮部（松指部）部署；民航—羽田、首爾、上海等國際與兩岸航線，及澎湖、金門、連江、花蓮、臺東國內航線樞紐；救災—空勤總隊松山駐地涵蓋北臺灣海空陸域搜救，內政部投資約35億元新建棚廠、規劃黑鷹直升機進駐，海巡署結合空勤總隊執行海上救援及離島後送；醫療—離島與東部醫療後送主要機場。【結論】本案後續建議宜由交通部洽各部會進一步審慎評估。", "ext": "松山機場為國家重要關鍵基礎設施且軍民合用，肩負國防、民航、救災救難等重要責任。國防：空軍松山基地指揮部（松指部）及相關營區、機坪與場站設施。民航：國際與兩岸航線（羽田、首爾、上海、廈門、福州），國內離島（澎湖、金門、連江）及東部（花蓮、臺東）航線樞紐。救災：空勤總隊松山駐地涵蓋北臺灣海空陸域搜救，內政部投資約35億元新建棚廠，規劃黑鷹直升機進駐（目前以海豚直升機為主）；海巡署偵防分署吊掛分隊結合空勤總隊執行海上救援及離島後送，松山機場為其中一個吊掛部隊據點。醫療：離島與東部醫療後送主要機場，攸關醫療後送、醫療人員往返交通成本。綜上，遷建議題宜由國防、救災、國際民航、離島及東部運輸等各層面考量，後續建議由交通部洽各部會進一步審慎評估。", "data": "空勤總隊新棚廠投資約35億元；黑鷹直升機規劃進駐", "risk": "遷建議題涉及國防、救災、民航、醫療多層面，不能僅由單一城市觀點考量；離島與東部醫療後送、搜救能量可能受影響", "forb": "", "region": "臺北市", "project": "松山機場", "policy": "", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 3, "topic": "公共建設", "q": "大臺中地區山海線鐵路雙軌高架化建置計畫可行性研究之山線及海線計畫進度及可否要求中央全額補助？（楊瓊櫻、顏寬恒、江啟臣、羅廷瑋委員）", "leg": "楊瓊櫻、顏寬恒、江啟臣、羅廷瑋", "pri": "中", "short": "山線及海線可行性研究前經行政院秘書長115年1月26日函復交通部請修正後再行報院；中央全額補助一節，須俟交通部提報修正後計畫，綜整會審機關意見，並遵從行政院政策決定，地方依規定仍須負擔配合款。", "std": "【立場】山線及海線可行性研究前經行政院秘書長115年1月26日函復交通部請修正後再行報院；是否由中央專案全額負擔，將俟交通部提報修正後計畫，綜整會審機關意見，並遵從行政院政策決定，以支持臺中地方建設。【辦理歷程】山線大慶至烏日約3.7公里，總經費83.4億元（中央36.54億元、補助比例78%、地方46.86億元），自償率27.35%、經營比1.28、益本比1.2，核定後7年；海線大甲、清水、沙鹿立體化約10.9公里、消除6平交道，總經費398.88億元（中央201.03億元、補助比例69.91%、地方197.84億元），自償率15.97%、經營比1.3、益本比1.03，核定後13年。【結論】鐵路立體化補助依交通部審查作業要點，按自償率對應地方財力級次補助非自償經費，地方須負擔配合款；全額補助應遵從行政院政策決定；另114年3月21日修正財劃法後，中央負擔分擔比例應依114年8月29日修正之中央對地方補助辦法辦理。", "ext": "山線：大慶車站南方至烏日車站，烏日站改高架，約3.7公里，範圍內無平交道；核定後7年；總經費83.4億元（中央36.54億元、補助比例78%、地方46.86億元，含用地費13.47億元、自償性23.08億元、非自償性10.3億元）；自償率27.35%、經營比1.28、益本比1.2。海線：大甲、清水、沙鹿立體化約10.9公里，三站改高架，消除6個平交道；核定後13年；總經費398.88億元（中央201.03億元、補助比例69.91%、地方197.84億元，含用地費29.22億元、自償性64.62億元、非自償性103.99億元）；自償率15.97%、經營比1.3、益本比1.03。癥結點：提報分山、海線2案卻將甲后線（前彩虹線）納入運量、財務、經濟效益及營運分析；兩本計畫書內容幾乎相仿，未區分各自可行性；海線雙軌內容屬行政院另案核定之「臺鐵海線雙軌化（談文至追分）」範疇，應予刪除；工程單價不一致、物調費未覈實。中央全額補助：鐵路立體化審議依交通部101年8月21日「鐵路平交道與環境改善建設及周邊土地開發計畫審查作業要點」，按自償率對應地方財力級次補助非自償性經費，地方須負擔配合款；能否專案全額負擔，應遵從行政院政策決定。審議進度：交通部113年3月29日函報行政院，113年4月8日交議本會，本會113年6月19日函請修正，113年7月30日、8月20日、9月20日、12月6日、114年3月13日催辦，114年10月14日綜整意見函復行政院，行政院115年1月26日函復交通部請修正後再行報院，並請檢討辦理時效、就經費分擔達成共識；另114年3月21日修正財劃法後，中央負擔分擔比例應依114年8月29日修正「中央對直轄市及縣（市）政府補助辦法」辦理，交通部應全面檢討交通建設補助審查作業要點。", "data": "山線83.4億元（中央36.54億）、海線398.88億元（中央201.03億）；山線自償率27.35%、海線15.97%", "risk": "提報分山、海線2案卻將甲后線納入運量與效益評估；兩本計畫書內容幾乎相仿，未區分各自可行性；海線雙軌內容屬另案核定之臺鐵海線雙軌化範疇應刪除；工程單價不一致、物調費未覈實；財劃法修正後補助比例須依新辦法", "forb": "", "region": "臺中", "project": "山海線鐵路", "policy": "", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 4, "topic": "公共建設", "q": "高鐵延伸宜蘭有助於完善全國鐵道路網、健全國土均衡及TOD發展，並使宜蘭納入北臺一日生活圈（吳宗憲委員）", "leg": "吳宗憲", "pri": "高", "short": "行政院115年7月28日已核定高鐵延伸宜蘭綜合規劃；本案有助改善臺鐵樹林至七堵瓶頸、宜蘭聯外交通及花東鐵路運輸，南港至宜蘭約20分鐘，將宜蘭納入首都圈黃金廊帶生活圈，帶動宜花東產業及觀光，落實均衡臺灣政策。", "std": "【立場】高鐵延伸宜蘭有助改善臺鐵樹林至七堵瓶頸、宜蘭聯外交通及花東鐵路運輸，提升整體軌道運輸效能，帶動宜花東產業及觀光，落實均衡臺灣政策；行政院115年7月28日已核定綜合規劃。【辦理歷程】北宜直鐵受限七堵—樹林瓶頸，單向每小時約1班；高鐵延伸後單向每小時最高12班次，南港至宜蘭約20分鐘；新增獨立路廊與臺鐵互為備援，提高防災韌性；宜蘭高鐵特定區以TOD規劃，劃定都市成長邊界避免蔓延農地；以宜蘭站為花東鐵路串聯西部高鐵的轉運樞紐；西部高鐵通車經驗顯示高鐵與臺鐵互補而非競爭。【結論】本會六大區域產業及生活圈規劃以高鐵延伸宜蘭為前提，將宜蘭納入首都圈黃金廊帶生活圈，北北基宜形成複合生活圈。", "ext": "行政院115年7月28日核定高鐵延伸宜蘭綜合規劃。高鐵延伸宜蘭有助改善臺鐵樹林至七堵路段瓶頸、宜蘭聯外交通及花東鐵路運輸，帶動宜花東產業及觀光，落實均衡臺灣。效益：(1)解開臺鐵瓶頸：北宜直鐵受限七堵—樹林端，單向每小時約1班；高鐵獨立路廊不受臺鐵容量束縛，單向每小時最高12班次，且與臺鐵互為備援，提高防災韌性；非以解決國五塞車為單一目的。(2)宜蘭納入北臺一日生活圈：南港至宜蘭約20分鐘，班次密集、準點快速；本會六大區域產業及生活圈規劃以此為前提，將宜蘭納入首都圈黃金廊帶生活圈，北北基宜形成工作、居住、觀光、教育、醫療與研發的複合生活圈。(3)帶動生活、消費及產業：車站為集客核心，人流轉化為停留與消費，宜蘭站為往花東旅次轉運樞紐。(4)TOD發展：宜蘭高鐵特定區劃定都市成長邊界，避免無序蔓延農地，以車站為核心結合住宅、商業、產業、健康休閒、會展、機關、社宅與社福設施。(5)花東轉運新樞紐：以宜蘭站串聯西部高鐵與花東鐵路，改善花東軌道聯外運輸。(6)臺鐵高鐵互補：西部高鐵通車經驗顯示兩者互補合作，臺鐵並未營運惡化；未來以高鐵為高速骨幹、臺鐵為區域及轉乘路網，提升整體綜效。", "data": "行政院115年7月28日核定綜合規劃；南港至宜蘭約20分鐘；單向每小時最高12班次（北宜直鐵僅約1班）", "risk": "非以解決國五塞車為單一目的，避免被誤解為塞車解方；須與臺鐵整合互補而非競爭", "forb": "", "region": "宜蘭", "project": "高鐵延伸宜蘭", "policy": "均衡臺灣、六大區域治理", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 5, "topic": "公共建設", "q": "嘉義縣馬稠後園區聯外道路辦理情形？（蔡易餘委員）", "leg": "蔡易餘", "pri": "中", "short": "兩園區目前聯外交通尚稱便捷，聯外道路緊鄰台82線可快速連接國1、國3；後續由相關機關就園區聯外交通及地方發展需求評估效益後依排程循序推動，並視嘉科開發進程、交通需求及整體路網效益納入評估，本會將配合行政院交議適時協助審議。", "std": "【立場】兩園區目前聯外交通尚稱便捷；後續由相關機關就園區聯外交通及地方發展需求評估效益後依排程循序推動，本會將配合行政院交議適時協助審議。【辦理歷程】馬稠後園區約343.78公頃，聯外以縣道167線及嘉45線為主、皆已拓寬為雙向四車道，緊鄰台82線（祥和交流道）可快速連接國1、國3；第一期進駐率100%、29家廠商，後期約97家申請、進駐率約52%；本會115年7月6日函詢經濟部、交通部、嘉義縣政府；嘉義縣政府已將馬稠後直通嘉科的高架道路構想納入縣治特區及周邊科技產業園區交通路網整體規劃中長期方向研議。【結論】後續視嘉科開發進程、交通需求及整體路網效益，於嘉科交流道公建計畫或相關先期規劃一併納入評估。", "ext": "馬稠後產業園區基本資料：嘉義縣政府依原「促進產業升級條例」申請編定，總面積約343.78公頃；聯外道路（南北向）以縣道167線（貫穿園區）及嘉45線為主，目前皆已拓寬為雙向四車道；外圍快速公路網緊鄰台82線東西向快速公路（祥和交流道），可快速連接國道1號及國道3號；主要引進醫藥生物科技及精緻農業科技、精緻文化及數位內容科技、綠能、電子及精密機械、橡膠塑膠製品、汽車及其零件製造等產業；第一期開發區進駐率100%、29家廠商進駐，後期開發區申請進駐廠商約97家、進駐率約52%。辦理情形：本會115年7月6日函復委員，本案涉及交通建設、產業政策及地方發展等面向，事涉交通部、經濟部及嘉義縣政府等機關權責，本會將函請相關機關提供意見後續處；同日函詢經濟部、交通部、嘉義縣政府。經濟部表示高架道路建設涉及區域路網、運量、工程可行性、用地、環評及經費，建請由交通部及嘉義縣政府依整體區域發展需求、交通量預測及公共建設程序審慎評估辦理。交通部建議回歸兩園區發展需求面檢討，由南科管理局及嘉義縣政府提出聯外需求路線規劃，再由道路權責主管機關研議推動。嘉義縣政府表示馬稠後直通嘉科的高架道路構想，已納入「嘉義縣縣治特區及周邊科技產業園區交通路網整體規劃」中長期路網改善方向研議，後續可配合嘉科開發進程、交通需求及整體路網效益，於嘉科交流道公共建設計畫或相關先期規劃一併納入評估，並協調中央相關部會研議推動方式。後續國科會、交通部、經濟部及嘉義縣政府將就園區聯外交通及地方發展需求，評估計畫效益後依排程循序推動，本會將配合行政院交議適時協助審議。", "data": "園區約343.78公頃；第一期進駐率100%（29家）、後期約52%（約97家申請）", "risk": "高架道路構想涉及區域路網、運量、用地、環評及經費，須由交通部及縣府依整體需求審慎評估；非單一機關權責", "forb": "", "region": "嘉義", "project": "馬稠後園區聯外道路", "policy": "", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 6, "topic": "公共建設", "q": "連江縣南北竿跨海大橋（馬祖大橋）綜合規劃（修正四版）辦理情形？", "leg": "陳雪生", "pri": "高", "short": "行政院107年12月10日同意可行性評估；綜合規劃修正四版已於115年7月31日報院，本會115年9月23日函請交通部於文到1週內回應說明併修正計畫書，目前交通部尚未函復；本案總經費379.56億元，並與北竿機場改善、南竿機場存廢相互關聯，須整體考量。", "std": "【立場】行政院107年12月10日同意可行性評估；綜合規劃修正四版已於115年7月31日報院，行政院秘書長115年8月4日函請本會審議，本會115年9月23日函請交通部於文到1週內回應說明併修正計畫書，目前交通部尚未函復。【辦理歷程】路線北竿白沙港南緣至南竿機場西側環保路，全長約4.3公里（海域橋梁段約3.2公里、橋寬15公尺，雙向各1快+1機車+1人行道）；總經費379.56億元（修正三版288.48億元，增加91.08億元；可研127.14億元），預定核定後13年完工；60公尺深槽區約600公尺，採3跨200公尺大跨徑預力箱型梁橋；本會113年10月11日完成委辦評估，重新概算約392.45億元，工期約90個月，若管控得宜可略縮短。【結論】本案與北竿機場改善、南竿機場存廢相互關聯，114年3月18日行政院卓院長表示須整體考量，並重新檢視總經費增加原因及中央與地方經費分擔。", "ext": "工程概要：起點北竿鄉白沙港南緣，終點南竿鄉南竿機場西側環保路，興建預力混凝土梁跨海大橋（可研階段主橋段採斜張橋），路線全長約4.3公里，其中海域橋梁段長約3.2公里，橋寬約15公尺，配置雙向各1快+1機車+1人行道；計畫總經費379.56億元（修正三版288.48億元，增加91.08億元；可行性研究127.14億元），預定建設計畫核定後13年內完工（修正三版為11年）；海域橋梁段3.2公里中，60公尺深槽區長度約600公尺，規劃採3跨200公尺大跨徑預力箱型梁橋跨越。審議歷程：行政院107年12月10日同意可行性評估；交通部110年8月23日、12月10日、111年6月30日、12月2日將綜合規劃4次報院（首版及修正一、二、三版），因興建馬祖大橋與北竿機場改善及南竿機場存廢相互關聯，行政院秘書長最近一次於112年6月13日就修正三版函請交通部再檢討修正，考量南北竿在地居民較少、工程難度及經費高、效益尚待更嚴謹評估，且行政院已原則支持北竿機場改善及擴建，請交通部俟北竿機場跑道改善及新航站區擴建工程核定且動工後，於施工期間再依南竿機場旅運量及在地居民增長情形，重新評估興建必要性。115年7月31日交通部將修正四版報院，係因考量馬祖大橋倘於118年北竿機場改善計畫動工後再行報院，恐不符連江縣居民加速全天候陸運交通之期待，且總建設期程達13年，現階段啟動有助加速將北竿機場改善效益極大化；行政院秘書長115年8月4日函請本會審議，本會115年9月23日函請交通部於文到1週內參酌有關機關意見回應說明併修正計畫書，目前交通部尚未函復。本會委辦評估：112年10月6日陳雪生委員施政質詢時，行政院陳前院長表示馬祖大橋屬工程難度甚高之深海域海事工程，工程技術尚待克服，尚難合理預估總經費，請國發會辦理較嚴謹評估；本會113年10月11日完成評估、113年9月30日陳報行政院備查，結論為工程技術面應屬可行，惟營建物價及成本上漲，總建設費用重新概算約392億4,546萬元（較綜規報告288億4,822萬元增加約103億9,725萬元），工期約90個月，若施工管控得宜可略縮短；發包策略建議參照金門大橋與淡江大橋經驗，採共同投標或開放外國廠商投標，合理編列預算並寬列投標廠商特定資格限制，減少流標成本。114年3月18日陳雪生委員再質詢，行政院卓院長表示南竿機場存廢、北竿機場整建、南北竿大橋建設須整體考量，並重新檢視總經費增加原因及中央與地方經費分擔事宜。", "data": "總經費379.56億元（修正三版288.48億、可研127.14億）；全長約4.3公里、海域段3.2公里；核定後13年完工；本會委辦重估約392.45億元", "risk": "在地居民較少、工程難度及經費高，效益尚待更嚴謹評估；經費由127.14億增至379.56億元，增幅大；與北竿機場改善及南竿機場存廢連動；中央與地方經費分擔待檢視；深海域海事工程技術待克服", "forb": "", "region": "連江", "project": "馬祖大橋", "policy": "", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 7, "topic": "公共建設", "q": "高鐵橋下台37線嘉義太保延伸至臺南新營案規劃情形？（蔡易餘委員）", "leg": "蔡易餘", "pri": "中", "short": "本案尚未陳報行政院；交通部已啟動台37線延伸至南科（善化）可行性評估，預計116年完成，串連嘉義科學園區與臺南科學園區，有利南部半導體S廊帶整體發展，俟可行性評估完成後再依程序辦理。", "std": "【立場】本案尚未陳報行政院；交通部已啟動可行性評估，預計116年完成，串連嘉義科學園區與臺南科學園區，有利南部半導體S廊帶整體發展。【辦理歷程】路線由現有台37線南側終點（嘉義縣鹿草鄉）沿高鐵橋下向南延伸至臺南市新營區，並評估再延伸至南科（善化），約40公里；可研委辦案114年2月12日開標、4月7日決標，金額17,511,018元；公路局114年8月21日召開期初報告審查會；交通部前於108年5月及109年1月二度報院，行政院秘書長函請再檢討研議；113年8月14日立法院交通委員會考察後，交通部113年11月27日原則同意重啟可研。【結論】俟可行性評估完成後，再依程序辦理。", "ext": "工程概要：由現有省道台37線（即高鐵嘉義站「高鐵橋下道路」）南側終點（嘉義縣鹿草鄉），沿高鐵橋下向南延伸至臺南市新營區，並評估再延伸至南科（善化），路線長約40公里；可行性評估委託案金額17,511,018元。辦理情形：交通部前於108年5月及109年1月二度報院，行政院秘書長於108年7月25日及109年4月7日函核復交通部，請再予檢討研議。立法院交通委員會113年8月14日考察嘉義縣交通建設，結論為縣府建議台37線南延重啟可研部分，交通部表示現況嘉義高鐵區已與北臺南成為共同生活圈，且高鐵沿線科學園區發展、環境已有大幅改變，請公路局與嘉義縣政府先行檢視109年行政院核示再檢討意見，倘確認已有整體環境變化，可重啟可行性向中央爭取支持。交通部於113年11月27日核復公路局，原則同意辦理「台37線（高鐵橋下側車道）延伸至南科（善化）可行性評估」（約40公里），本案114年2月12日開標、4月7日決標（17,511,018元），公路局114年8月21日召開期初報告審查會，預計116年完成可行性評估作業。計畫效益：台37線向南延伸可快速串連嘉義科學園區與臺南科學園區，有利南部半導體S廊帶整體發展。", "data": "路線約40公里；可研委託金額17,511,018元；預計116年完成可研", "risk": "108、109年兩度報院均被要求再檢討研議；須確認整體環境變化後重啟", "forb": "", "region": "嘉義、臺南", "project": "台37線", "policy": "", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 8, "topic": "公共建設", "q": "桃竹苗大矽谷後續推動進度—請中央儘速認定苗栗3處科學園區與產業園區為重大建設範圍，以利辦理土地變更程序，加速土地取得及開發？（陳超明委員）", "leg": "陳超明", "pri": "中", "short": "行政院113年9月30日核定「桃竹苗大矽谷推動方案」，已將苗栗3處納入未來可列入評估開發；實際開發區位、範圍與面積應由國科會與經濟部依相關法令實質審查後逐步落實，本會已成立桃竹苗大矽谷區域治理協調平台持續協調。", "std": "【立場】行政院113年9月30日核定「桃竹苗大矽谷推動方案」，已將3處納入未來可列入評估開發；實際開發區位、範圍與面積應由國科會與經濟部納入地方產業發展需求、土地利用現況及生態環境條件，依法實質審查後逐步落實；本會已成立桃竹苗大矽谷區域治理協調平台持續協調。【辦理歷程】3處儲備用地—竹南擴大（竹南鎮約300公頃，緊鄰竹科竹南園區西側）、竹南擴大（頭份市約330公頃，緊鄰竹南園區東南側）、後龍產業園區（約330公頃，鄰近國3）；頭份交流道附近農地，縣府已啟動都市計畫變更前置作業，國科會俟變更及用地取得完成後再研議可研；後龍產業園區行政院已核示經濟部為中央目的事業主管機關，縣府委辦可研報告預訂116年1月送經濟部審查；竹南擴大涉及特定農業區農牧用地變更，須認定為重大建設，115年6月29日平台會議請縣府提供可研報告予經濟部，並研議透過苗栗縣國土計畫通盤檢討將必要範圍劃設為城2-3。【結論】土地變更須經行政院核定之重大建設或公共建設所需，始得辦理農地變更及徵收；後續協調事項持續於平台討論。", "ext": "行政院113年9月30日核定「桃竹苗大矽谷推動方案」，已將竹南科學園區擴大範圍（含竹南、頭份）、後龍產業園區納入未來可列入評估開發科學園區與產業園區；惟方案屬上位產業空間指導政策，實際開發區位、範圍與面積應由中央目的事業主管機關納入地方產業發展需求、土地利用現況及生態環境條件，審慎評估並依相關法令實質審查。苗栗縣政府提出3處儲備用地：(1)竹南科學園區擴大（竹南鎮）約300公頃，緊鄰竹科竹南園區西側，縣府訴求爭取認定重大建設，新訂擴大都市計畫時免徵詢內政部區委會，特定農業區農牧用地可辦理變更；(2)竹南科學園區擴大（頭份市）約330公頃，緊鄰竹南園區東南側，縣府訴求都市計畫農業區變更；(3)後龍產業園區約330公頃，鄰近國3，縣府訴求爭取認定重大建設、可逕行辦理新訂擴大都市計畫，特定農業區農牧用地可申請變更。頭份交流道附近都市計畫農業區：114年11月17日區域治理協調平台決議請縣府先行啟動都市計畫變更前置作業，國科會俟變更及用地取得完成後，再研議科學園區可行性評估。後龍產業園區及竹南擴大爭點：涉及特定農業區農牧用地，土地變更依區域計畫法或都市計畫程序辦理並採區段徵收；依「農業用地變更使用審查作業要點」，非都市土地特定農業區農牧用地不同意變更，需由農業主管機關確認屬經行政院核定之計畫或公共建設所需用地；全國國土計畫及縣市國土計畫皆已核定，非位於擬新訂擴大都市計畫範圍者原則不得零星個案申請，除非配合國家重大建設需要；依「土地徵收條例」，特定農業區農牧用地不得徵收，須經行政院核定之重大建設所需始得排除。後龍產業園區：行政院秘書長114年5月19日函復可行性規劃評估設置應由經濟部本於權責確認；陳超明委員114年6月23日及25日召開釋疑會議結論，請縣府具體劃定開發區位範圍並完備可研報告書報送經濟部，俟行政院核定後據以向農業部申請農地變更，經同意後再依區域計畫法辦理後續作業；行政院已核示經濟部為本案中央目的事業主管機關，縣府委辦可研報告預訂116年1月送經濟部審查，俟經濟部報院並交本會審議，本會將儘速完成審議復院。竹南擴大：陳超明委員115年6月2日協調會議，建議縣府以公義路以西約165公頃特農區土地作為優先開發地區，並請本會透過區域治理平台邀集國科會、經濟部、內政部研商推動模式；本會115年6月29日召開平台會議，請縣府將可研報告提供經濟部，並同步研議透過苗栗縣國土計畫通盤檢討將必要土地範圍劃設為城2-3。陳超明委員多次質詢本會應協助行政院核定或協調主管部會認定；鑒於園區開發涉及國科會、經濟部、內政部等主管機關法令規定，本會已成立桃竹苗大矽谷區域治理協調平台，後續相關議題提報平台協調討論。", "data": "3處儲備用地約960公頃（竹南300、頭份330、後龍330）；後龍可研預訂116年1月送經濟部；行政院113年9月30日核定推動方案", "risk": "特定農業區農牧用地變更須認定重大建設，中央目的事業主管機關尚未協調出；非都市土地特定農業區農牧用地原則不得變更、不得徵收；國土計畫已核定，原則不得零星個案申請新訂擴大都市計畫", "forb": "", "region": "苗栗", "project": "桃竹苗大矽谷", "policy": "六大區域治理", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 9, "topic": "地方創生", "q": "臺南市後壁、新營、鹽水地區糖鐵五分車廊帶地方創生計畫？（陳亭妃委員）", "leg": "陳亭妃", "pri": "中", "short": "臺南市政府115年6月16日提送地方創生計畫，7月16日「行政院地方創生會報」第57次工作會議通過；先期規劃經費經交通部115年7月15日核定補助900萬元、由交通部鐵道局鐵道發展基金支應，後續由臺南市政府辦理先期評估規劃作業。", "std": "【立場】臺南市政府115年6月16日提送地方創生計畫，7月16日「行政院地方創生會報」第57次工作會議通過，各部會補助案件將陸續核定，請市府及民間團隊據以執行。【辦理歷程】本會115年5月6日召開「溪北糖鐵廊帶振興前導計畫」地方創生輔導會議，行政院卓院長6月12日至新營糖廠現地視察指示市府儘速修正提報；市府115年2月2日函送先期計畫規劃案至交通部，交通部115年7月15日審議核定補助900萬元，由交通部鐵道局鐵道發展基金支應；市府建議比照前瞻基礎建設計畫支應嘉義蒜頭糖廠五分車延駛路線方式辦理，經費爭取中央補助，後續由市府辦理先期評估規劃。【結論】先期規劃經費已核定，後續由臺南市政府辦理先期評估規劃作業。", "ext": "本會115年5月6日召開「溪北糖鐵廊帶振興前導計畫」地方創生輔導會議決議及行政院卓院長6月12日至新營糖廠現地視察指示，請臺南市政府儘速修正計畫提報本會，市府於6月16日提送地方創生計畫，本會已於7月16日「行政院地方創生會報」第57次工作會議通過，各部會補助案件將陸續核定，請臺南市政府及民間團隊據以執行。另有關「臺南市後壁新營鹽水地區糖鐵五分車廊帶地方創生先期計畫規劃案」，臺南市政府建議比照由前瞻基礎建設計畫支應嘉義蒜頭糖廠五分車延駛路線方式辦理，經費將爭取中央補助，後續由臺南市政府辦理先期評估規劃作業。臺南市政府於115年2月2日函送先期計畫規劃案至交通部，經交通部115年7月15日審議核定補助臺南市政府900萬元，由交通部鐵道局鐵道發展基金支應。", "data": "鐵道局核定補助900萬元（115年7月15日）；計畫7月16日第57次工作會議通過", "risk": "先期規劃經費爭取中央補助方式待確認（比照嘉義蒜頭糖廠前瞻模式）", "forb": "", "region": "臺南", "project": "", "policy": "地方創生", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 10, "topic": "地方創生", "q": "請問國發會媒合企業ESG對接創生團隊有何做法及案例？", "leg": "", "pri": "中", "short": "本會與金管會及證交所合作，將地方創生範例納入115年度ESG評鑑（S-3、G-32指標），引導上市櫃公司支持地方創生，並提出加速器型、價值整合型、生態建構型三大合作模型，透過評鑑引導、模型對接與示範案例，擴散企業投入地方創生的動能。", "std": "【立場】本會與金管會及證交所合作，共同推動115年度ESG評鑑納入地方創生案例，引導上市櫃公司支持地方創生；並提出企業投入地方創生的三大模型，提供最務實的實踐路徑。【辦理歷程】ESG評鑑納入社會面S-3、治理面G-32指標；三大模型：加速器型（企業深耕地方、協助產業升級）、價值整合型（以核心本業共創商機）、生態建構型（跨域整合解決系統性挑戰）；共創計畫委託資誠永續辦理，已獲金寶電子、玉山銀行、全家便利商店、晶睿通訊率先響應承諾；中華開發資本加碼投資獎勵青年投入地方創生計畫，112–114年共發出1,000萬元獎勵金；凱基金控「地方創生行動家＋」以財務、法律、管理專業志工長期陪伴團隊；萬家福×青培站聯合市集共辦地產地銷市集。【結論】透過評鑑引導、模型對接與示範案例，擴散企業投入地方創生的動能。", "ext": "輔導及媒合策略：本會為引導企業參與地方創生，特與金融監督管理委員會及臺灣證券交易所合作將地方創生範例納入「115年度ESG評鑑」，包含社會面S-3評鑑指標、治理面G-32評鑑指標，有助於上市櫃公司與各界參考範例及國發會地方創生資訊共享平臺，瞭解查詢相關資訊，以具體行動支持地方創生發展，深化在地連結、實踐永續共好。三大合作模式：1、「加速器型：企業深耕地方」—企業針對營運地點、家鄉或特定議題投入資源，扮演「加速器」角色，協助在地產業升級轉型；2、「價值整合型：核心本業共創」—企業運用核心本業能力或關注的ESG議題，與地方創生團隊探索新商機，在永續趨勢下共同開發具競爭力的新產品及服務；3、「生態建構型：跨域整合行動」—強調多方協力，企業結合地方創生團隊與產官學等第三方組織專業，共同解決區域的系統性挑戰。具體媒合案例：(1)本會推動地方創生與企業永續共創計畫，委託資誠永續發展服務公司辦理，已獲得國內多家指標性企業率先響應與承諾投入（金寶電子、玉山銀行、全家便利商店及晶睿通訊），有助引領企業積極投入地方創生，並將動能擴散至產業界。(2)中華開發資本加碼投資「獎勵青年投入地方創生計畫」，以公私協力形式支持地方創生，112–114年共發出1,000萬元獎勵金，並結合開發資本投資經驗、產業網絡與凱基金控集團資源，從獎勵金、經營培力到市場連結，全方位陪伴地方團隊成長與轉型。(3)凱基金控「地方創生行動家＋」專案：本會引介全台各地創生團隊參與專案，藉由金控公司專業志工團隊（財務、法律、管理）長期陪伴，解決地方創生團隊財務運作問題，逐步建立系統化財務模式，提升財務管理效率及商業思維，避免燃燒理想與熱情、容易虧損的營運模式，提升永續發展能力。(4)萬家福×青培站聯合市集：本會媒合萬家福與青培站，共辦地產地銷與友善環境市集，藉萬家福通路及品牌資源接觸更多目標客群，提升產品與品牌影響力，企業與團隊雙方互惠，萬家福支持地方創生，又實現企業品牌的永續形象。", "data": "112–114年中華開發資本獎勵金共1,000萬元；ESG評鑑S-3、G-32指標", "risk": "企業參與需精準對接地方需求，避免一次性贊助而無永續模式", "forb": "", "region": "全國", "project": "", "policy": "地方創生", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 11, "topic": "地方創生", "q": "地方創生政策目前推動情形為何？", "leg": "", "pri": "高", "short": "行政院113年6月5日核定「打造永續共好地方創生計畫（114–117年）」，由本會偕同11個部會共同推動、4年投入經費共60億元；截至115年9月30日輔導地方提出278件計畫、通過243件，其餘35件輔導中，後續從鼓勵在地創新提案、建立在地青年支持系統、強化輔導能量三大方向持續推動。", "std": "【立場】行政院113年6月5日核定「打造永續共好地方創生計畫（114–117年）」，由本會偕同11個部會共同推動，預計4年投入經費共60億元（114、115年法定預算分別約11億元，116年概算約13.42億元）。【辦理歷程】截至115年9月30日，輔導地方提出278件地方創生計畫，通過243件（涵蓋243處鄉鎮市區、129處優先推動地區、52處原民地區），其餘35件輔導中；優先推動地區134處中已有129處通過（96.3%）；多元徵案117件、通過100件；青年培力工作站110–115年累計補助148案（核定經費約10億2,058萬元）、目前73案執行中；獎勵青年投入地方創生112–115年累計264案（115年65案）；育成村累計扶植265組團隊；110–114年績效：關係人口約32.1萬人次、青年留返鄉約1.43萬人次、增加工作機會約1.55萬人次、觀光人潮約1,428萬人次、提升地方營收約26億元；115年可支用預算13.94億元，截至115年9月執行6.09億元（43.69%）；116年編列13.42億元。【結論】地方創生從三大方向持續推動：鼓勵在地創新提案、建立在地青年支持系統、強化輔導能量（北中南東分區輔導中心及專案辦公室）。", "ext": "政策推動方向及作法：(1)鼓勵以在地創新解決問題之提案：新增多元徵案管道，不以鄉鎮公所作為單一收案平臺，地方團體或個人可透過多元徵案途徑，整合地方共識後提出地方創生計畫；目前輔導地方循多元徵案管道提出117件計畫，其中100件經「行政院地方創生會報」工作會議通過。(2)建立在地青年支持系統：地方創生青年培力工作站自110年度至115年度累計補助148案，核定補助經費共約10億2,058萬元，目前73案執行中；獎勵青年投入地方創生行動計畫自112年度至115年度累計獲獎勵團隊264案（115年度65案，風土物產、創生體驗及場域經營三類，每案最高獎勵金35萬元）；「地方創生利他行動168」專案以「利他、共好」為核心，最高68萬元獎勵金，115年獎勵39案；中興新村地方創生育成村111年迄今累計扶植265組團隊。(3)強化輔導能量：建構北、中、南、東分區輔導中心（中區逢甲大學、南區國立中山大學、東區雅比斯國際創意策略股份有限公司、北區共創設計有限公司），並成立專案辦公室辦理補助計畫徵件審查、管考追蹤及部會地方資源協調整合。整體推動情形：截至115年9月30日，輔導地方提出278件地方創生計畫（涵蓋253處鄉鎮市區、130處優先推動地區、53處原民地區），經工作會議通過243件（涵蓋243處鄉鎮市區、129處優先推動地區、52處原民地區），其餘35件輔導中；優先推動地區134處中已有129處通過（96.3%），僅餘5處陸續召開輔導會議後提報。整體推動績效（110–114年）：建立關係人口約32.1萬人次、促進青年留鄉/返鄉約1.43萬人次、增加工作機會約1.55萬人次、促進觀光人潮約1,428萬人次、提升地方整體營收約26億元。115年可支用預算：12個部會合計可支用13億9,356萬1千元（114年保留2億8,291萬6千元、115年預算11億1,064萬5千元），截至115年9月執行6億879萬2千元，執行率43.69%（國發會56.94%、教育部67.62%、交通部觀光旅遊34.70%、農業部31.95%、文化部28.30%、客委會3.03%）。116年預算編列：合計13億4,200萬元（國發會4億元、農業部2.3億元、交通部1.92億元、文化部1.4億元、教育部及經濟部各8,000萬元）。", "data": "4年60億元（114、115年各約11億、116年概算13.42億）；278件提出、243件通過、35件輔導中；優先推動地區通過率96.3%；青培站累計148案、執行中73案；關係人口32.1萬人次、青年留返鄉1.43萬人次、營收提升26億元；115年執行率43.69%", "risk": "115年跨部會預算執行率僅43.69%，客委會執行率僅3.03%、文化部28.30%、農業部31.95%，執行落差待追蹤；優先推動地區尚餘5處未通過", "forb": "", "region": "全國", "project": "", "policy": "地方創生", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 12, "topic": "地方創生", "q": "地方創生著重補助團隊於初期發展之所需資源，立意良好，請研議將團隊後續可自主營運之能力列為適當KPI（楊瓊瓔委員）", "leg": "楊瓊瓔", "pri": "中", "short": "地方創生政策不是永久補助制度，而是建立青年返鄉、留鄉的支持體系；本會補助涉及的地方團隊超過600個，其中98.5%營運超過3年，本會將持續觀察及統計團隊營運情形，研議將團隊自主營運列為未來KPI，並逐步啟動良性退場機制。", "std": "【立場】地方創生政策不是永久補助制度，而是建立青年返鄉、留鄉的支持體系，持續提供地方需要的服務與公共價值；團隊是否具永續性，不宜單以「有無拿政府補助」判斷，應觀察自主收入、穩定服務、地方合作網絡及人才培育能力。【辦理歷程】本會補助涉及的地方團隊超過600個，其中98.5%營運超過3年；不少團隊在補助退場後持續獨立營運，例如臺中市好伴、彰化縣溪州尚水、苗栗縣耕山農創、花蓮縣洄遊吧、牛犁社區交流協會等，均持續活躍並帶動其他團隊共好。【結論】委員建議可將團隊自主營運列為未來地方創生具體KPI，本會將持續觀察及統計團隊營運情形，研議提升補助資源分配效益，逐步啟動良性退場機制，俾使補助資源對接扶植更多有志地方創生青年團隊。", "ext": "地方創生政策基本立場：不是永久補助制度，而是建立青年返鄉、留鄉的支持體系，持續提供地方需要的服務與公共價值。我國地方創生政策特別強調以青年為主體，補助地方團隊設置青年培力工作站之目的，係為營造青年留鄉、返鄉創業支援體系，以永續、公益、共好為核心精神，陪伴輔導青年開創地方創生事業。因此，地方創生團隊是否具永續性，不宜單以「有無拿政府補助」作為判斷依據；即使地方團隊發展成熟、具備獨立營運之能力，仍可能因人才培育、公共服務、地方串聯或擴大影響力等工作，與政府、企業或其他單位合作，真正應觀察的是團隊是否逐步建立自主收入、穩定服務、地方合作網絡及人才培育能力，並能持續留在地方發展。本會作為地方創生政策推動的主責機關，希望在地方團隊面臨青年返鄉、留鄉及事業發展的不同階段，均能夠提供適切之支持，降低初期風險、協助建立營運能力，並逐步朝自主營運發展，最終希望地方團隊將已經建立的在地基礎及支持系統持續擴散至更多青年、店家、社區及地方產業，建立起與在地共好之營運模式。委員期待可將團隊自主營運列為未來地方創生具體KPI：本會補助之獎勵金、青年培力工作站、地方創生事業提案等所涉及的地方團隊超過600個，其中98.5%皆營運超過3年，不少團隊在政府補助資源退場後，持續透過自身事業、地方合作、企業資源等各項方式獨立營運，例如臺中市好伴、彰化縣溪州尚水、苗栗縣耕山農創、花蓮縣洄遊吧 Fish Bar、牛犁社區交流協會等團隊，均持續活躍於地方，更帶動地方上其他團隊共好發展，顯見地方創生團隊已逐步發展自主經營之量能及模式。對已經在地方深耕多年的團隊，申請政府資源的目的，往往不是維持基本營運，而是希望培力更多青年、串聯更多地方店家與產業，讓原本建立的共好模式擴散到更多人。本會將持續觀察及統計地方團隊之營運情形，並研議提升補助資源之分配效益，逐步啟動良性退場機制，俾使補助資源對接扶植更多有志地方創生青年團隊，期待有更多團隊成員留在地方、持續經營事業、創造工作機會、培育人才、串聯地方夥伴及提供公共服務。", "data": "地方團隊超過600個，98.5%營運超過3年", "risk": "團隊永續性不宜單以有無補助判斷；補助退場機制與資源分配效益待研議", "forb": "", "region": "全國", "project": "", "policy": "地方創生", "src": "國土處模擬題庫【主委版】115-10-12"}, {"id": 13, "topic": "花東離島", "q": "委員關切之花東發展相關計畫（鄭天財、傅崐萁、伍麗華、盧縣一、林倩綺）", "leg": "鄭天財、傅崐萁、伍麗華、盧縣一、林倩綺", "pri": "中", "short": "花東地方建設需求多涉原民、運動、供水及教育設施，考量近年花蓮、臺東均有歲入歲出賸餘，且財劃法修正後地方財源增加，相關需求建議先洽縣政府協助，或納入縣綜合發展實施方案規劃辦理；各案均已函復或於協調會決議辦理方向，後續依權責機關及花東基金機制推動。", "std": "【立場】花東地方建設需求多涉原民、運動、供水及教育設施，本會就各案說明辦理情形；考量近年花蓮、臺東均有歲入歲出賸餘，且財劃法修正後地方財源增加，相關需求建議先洽縣政府協助，或納入縣綜合發展實施方案規劃辦理。【辦理歷程】鄭天財—吉安鄉東昌部落聚會所需經費約8,000萬元（興建4,000萬、換土4,000萬），原民會最高補助2,700萬元，缺口5,300萬元，因基地挖出陪葬品涉文資審查、都計分區未變更，尚未啟動；傅崐萁—花蓮南區全齡運動公園奉行政院115年2月4日核定，總經費2億7,197萬元（花東基金補助2億4,477.3萬元），基本設計115年9月17日審查，縣府115年10月13日召開複審；伍麗華—秀林鄉公所重建總經費暫估1億8,226萬元（公所自籌3,281萬元、擬請補助1億4,945萬元），南田旅客服務中心請公所儘速提報計畫；盧縣一—卓溪MASIAL廣場暫估1億2,809萬元（缺口6,151萬元）、多功能運動園區約5,000萬元；林倩綺—都蘭部落自來水延管可由經濟部無自來水改善計畫第五期（總經費106億元）協助，臺東女中海洋運動課程主體經費由臺東縣四期綜發方案編列2,000萬元支應。【結論】各案均已函復或於協調會決議辦理方向，後續依權責機關及花東基金機制推動。", "ext": "鄭天財委員—花蓮縣吉安鄉東昌部落聚會所進度及協助基地換土費：所需經費約8,000萬元（含興建費用4,000萬元、基地換土費用4,000萬元），原民會最高可補助2,700萬元，尚有經費缺口5,300萬元；鄭委員115年4月30日於立法院經濟委員會口頭質詢時，建議由花東基金支應基地換土費用。本案因基地挖掘出陪葬品，涉及文資審查程序，且都市計畫土地使用分區未完成變更，致墓地尚未完成起掘，聚會所規劃及換土作業尚未啟動。有關基地換土費用，本會115年5月8日函請花蓮縣政府研議納入該縣第四期（113–116年）綜合發展實施方案辦理，惟該府115年6月18日函送之滾動檢討案並未提出相關計畫；另考量財劃法修正施行後地方財政狀況已獲改善，所需經費亦可由縣府自有財源辦理。傅崐萁委員—花蓮縣南區全齡運動公園新建計畫基本設計審查進度：奉行政院115年2月4日核定，總經費2億7,197萬元，其中花東基金補助2億4,477萬3千元；花蓮縣政府115年8月28日將基本設計預算書圖陳報內政部審議，內政部115年9月17日召開審查會議，結論為原縣府考量成本擬修正總經費為3億1,600萬元，惟經審酌基地條件及行政院核定附帶條件，總經費仍以2億7,197萬元辦理，逾核定部分由縣府自籌並以另案發包；整體推動期程已落後，縣府應儘速依審查結論檢送修正設計圖說報內政部備查（縣府已定於115年10月13日召開複審會議）。伍麗華委員—花蓮縣秀林鄉地方建設：經115年6月11日會議，涉及本會部分為「秀林鄉公所辦公大樓重建案」，公所現有大樓使用已逾50年、建物結構老舊且空間不敷所需，規劃於現址重建地上3層新廳舍，總經費暫估1億8,226萬元，由公所自籌約3,281萬元（18%），其餘約1億4,945萬元（82%）擬請上級機關補助；考量近年花蓮、臺東均有歲入歲出賸餘，且財劃法修正後地方財源增加，建議先洽花蓮縣政府協助，或納入該縣綜合發展實施方案規劃辦理。臺東縣達仁鄉南田旅客服務中心：經115年2月3日會議決議，請達仁鄉公所及南田社區發展協會儘速提報計畫；基於臺東縣113–115年度花東基金鄉鎮市公所提案已審查完竣，且考量近年花蓮、臺東均有賸餘、財劃法修正後地方財源增加，建議公所先洽縣政府協助，或評估納入縣綜合發展實施方案額度內辦理；達仁鄉公所115年5月19日研提計畫予原民會，原民會轉請公所向本會申請花東基金鄉鎮提案，後本會函復原民會115年度花東基金鄉鎮提案並未開放受理，請原民會基於中央原住民族主管機關，由該會相關計畫經費或資源予以協助。盧縣一委員—花蓮縣卓溪鄉運動園區規劃經費：經115年9月10日協調會決議，MASIAL廣場興建工程總經費暫估1億2,809萬元（花蓮縣政府及公所自籌約6,658萬元、餘6,151萬元缺口擬申請中央部會補助），請原民會辦理實地勘查並評估可補助項目，另得循花東基金機制由花蓮縣政府評估納入該縣綜合發展實施方案辦理；多功能運動園區興建總經費約5,000萬元，全額擬申請中央補助，請卓溪鄉公所依運動部相關補助規定辦理，並請該部予以協助。林倩綺委員—臺東縣東河鄉都蘭部落自來水延管工程：經115年9月1日協調會決議，有關自來水延管工程，經濟部「無自來水地區供水改善計畫第五期」總經費106億元（中央公共建設預算96.5億元、台水公司事業預算6.5億元、花東基金3億元），都蘭部落自來水延管工程可由前開計畫協助。臺東女中海洋運動課程經費協助：課程主體經費由臺東縣第四期（113–116年）綜合發展實施方案「培育臺東運動未來人才計畫」之海洋運動推展計畫面海學校編列2,000萬元支應；場地與活動費用由教育部相關計畫經費協助，請臺東縣政府協助該校向教育部申請。", "data": "東昌聚會所約8,000萬元（缺口5,300萬）；南區全齡運動公園2億7,197萬元（花東基金2億4,477.3萬）；秀林公所重建1億8,226萬元；卓溪MASIAL廣場1億2,809萬元；無自來水改善第五期106億元", "risk": "東昌案涉文資審查及都計分區未變更；南區運動公園推動期程已落後，縣府擬增經費至3億1,600萬元未獲同意；財劃法修正後地方財源增加，中央補助角色須重新衡平", "forb": "", "region": "花蓮、臺東", "project": "", "policy": "花東基金", "src": "國土處模擬題庫【主委版】115-10-12"}];

function miniProj(name) { return '<span class="mini">' + projIcon(name) + "</span>";}
var byId = {};
QUESTIONS.forEach(function (q) { byId[q.id] = q;});
var legByName = {};
LEGISLATORS.forEach(function (l) { legByName[l.name] = l;});

function legNames(q) {
return q.leg? q.leg.split("、").map(function (s) { return s.trim();}).filter(Boolean): [];
}
function relatedQs(name) {
return QUESTIONS.filter(function (q) { return legNames(q).indexOf(name) >= 0;});
}

/* ── 圖卡 ── */
function qCard(q, matchLabel) {
var meta = [];
if (q.leg) meta.push("<span>委員 <b>" + esc(q.leg) + "</b></span>");
if (q.region) meta.push("<span>地區 <b>" + esc(q.region) + "</b></span>");
if (q.project) meta.push("<span>" + miniProj(q.project) + "<b>" + esc(q.project) + "</b></span>");
var chips = '<span class="chip">' + miniCat(q.topic) + esc(q.topic) + "</span>";
if (q.pri === "高") chips += '<span class="chip pri-high">高關注</span>';
if (matchLabel) chips += '<span class="chip match">' + esc(matchLabel) + "</span>";
return '<button type="button" class="qcard" data-qid="' + q.id + '">' +
'<div class="qtop">' + chips + "</div>" +
'<div class="qtitle">' + esc(q.q) + "</div>" +
(q.short? '<div class="qshort">' + esc(q.short) + "</div>": "") +
(meta.length? '<div class="qmeta">' + meta.join("") + "</div>": "") +
"</button>";
}
function lCard(l) {
var rel = relatedQs(l.name).length;
return '<button type="button" class="lcard" data-lname="' + esc(l.name) + '">' +
'<span class="lname">' + esc(l.name) + "</span>" +
(l.focus? '<div class="lfocus">關注：' + esc(l.focus) + "</div>": "") +
'<div class="lmeta">擬答 ' + rel + " 題</div>" +
"</button>";
}

/* ── 擬答清單 ── */
var homeTopic = null;
function renderHome() {
var total = QUESTIONS.length;
var hotAll = QUESTIONS.filter(function (q) { return q.pri === "高";});
var visible = QUESTIONS.filter(function (q) { return !homeTopic || q.topic === homeTopic;});
var hot = visible.filter(function (q) { return q.pri === "高";});
var rest = visible.filter(function (q) { return q.pri !== "高";});
$("#stats").innerHTML =
'<button type="button" class="stat" data-stat="all" aria-label="擬答 ' + total + ' 題，點看擬答清單"><b>' + total + '</b><span>擬答 <span class="arr" aria-hidden="true">›</span></span></button>' +
'<button type="button" class="stat hot" data-stat="hot" aria-label="高關注擬答 ' + hotAll.length + ' 題，點看擬答清單的高關注擬答"><b>' + hotAll.length + '</b><span>高關注擬答 <span class="arr" aria-hidden="true">›</span></span></button>' +
'<button type="button" class="stat" data-stat="people" aria-label="相關委員 ' + LEGISLATORS.length + ' 位，點看委員列表"><b>' + LEGISLATORS.length + '</b><span>相關委員 <span class="arr" aria-hidden="true">›</span></span></button>';
var note = $("#topicNote");
if (homeTopic) {
note.classList.remove("hidden");
note.innerHTML = "<span>只看類別：" + esc(homeTopic) + "（共 " + visible.length + " 題）</span>" +
'<button type="button" data-clear-topic="1">顯示全部</button>';
} else {
note.classList.add("hidden");
note.innerHTML = "";
}
$("#hotList").innerHTML = hot.length? hot.map(function (q) { return qCard(q);}).join(""): '<div class="empty">這個類別沒有高關注題目。</div>';
$("#restCount").textContent = "共 " + rest.length + " 題";
$("#restList").innerHTML = rest.length? rest.map(function (q) { return qCard(q);}).join(""): '<div class="empty">這個類別沒有其他題目。</div>';
$("#catIcons").innerHTML = TOPICS.map(function (t) {
var n = QUESTIONS.filter(function (q) { return q.topic === t;}).length;
return '<button type="button" class="icon-btn" data-goto-topic="' + esc(t) + '" aria-pressed="' + (homeTopic === t) + '" aria-label="類別：' + esc(t) + '，' + n + ' 題，點了在擬答清單只看這個類別">' +
'<span class="ic">' + (CAT_ICONS[t] || "") + '</span><span class="lb">' + esc(t) + '</span><span class="ct">' + n + ' 題</span></button>';
}).join("");
}

/* ── 委員 ── */
function renderPeople() {
$("#lList").innerHTML = LEGISLATORS.map(lCard).join("");
}

/* ── 搜尋 ── */
function matchDims(q, kw) {
var dims = [];
if (q.leg && q.leg.indexOf(kw) >= 0) dims.push("委員");
if (q.region && q.region.indexOf(kw) >= 0) dims.push("地區");
if (q.project && q.project.indexOf(kw) >= 0) dims.push("重大公建項目");
if (q.policy && q.policy.indexOf(kw) >= 0) dims.push("行政院重大政策");
if (dims.length) return dims;
if (q.q.indexOf(kw) >= 0 || q.topic.indexOf(kw) >= 0) dims.push("題目");
else if ((q.short + q.std + q.ext + q.data).indexOf(kw) >= 0) dims.push("擬答內容");
return dims;
}
function doSearch(kw) {
kw = kw.trim();
if (!kw) { showTab(lastTab); return;}
$$(".view").forEach(function (v) { v.classList.remove("active");});
$("#view-search").classList.add("active");
var qHits = [], lHits = [];
QUESTIONS.forEach(function (q) {
var d = matchDims(q, kw);
if (d.length) qHits.push({ q: q, label: "命中：" + d.join("、")});
});
LEGISLATORS.forEach(function (l) {
if (l.name.indexOf(kw) >= 0 || (l.focus && l.focus.indexOf(kw) >= 0)) lHits.push(l);
});
$("#searchCount").textContent = "「" + kw + "」· 題目 " + qHits.length + " · 委員 " + lHits.length;
var html = "";
if (qHits.length) {
html += '<h2 class="sec">題目 <span class="count">' + qHits.length + ' 題</span></h2><div class="cards two">' +
qHits.map(function (h) { return qCard(h.q, h.label);}).join("") + "</div>";
}
if (lHits.length) {
html += '<h2 class="sec">委員 <span class="count">' + lHits.length + ' 位</span></h2><div class="cards two">' +
lHits.map(lCard).join("") + "</div>";
}
if (!qHits.length &&!lHits.length) html = '<div class="empty">找不到「' + esc(kw) + "」，換個關鍵字試試：委員姓名、地區、項目或政策名稱。</div>";
$("#searchResults").innerHTML = html;
}

/* ── 分頁切換 ── */
var lastTab = "home";
function showTab(name) {
lastTab = name;
$$(".tab").forEach(function (t) { t.setAttribute("aria-selected", t.dataset.tab === name? "true": "false");});
$$(".view").forEach(function (v) { v.classList.remove("active");});
$("#view-" + name).classList.add("active");
window.scrollTo(0, 0);
}

/* ── 詳情 ── */
function bulletItems(text) {
var raw = String(text || "").replace(/\s+/g, " ").trim();
if (!raw) return [];
var parts = raw.split(/[；。]/);
var out = [];
parts.forEach(function (part) {
var t = part.trim().replace(/[，、]$/, "");
if (t) out.push(t);
});
return out;
}
function bulletsHtml(text) {
var items = bulletItems(text);
if (!items.length) return "";
if (items.length === 1) return "<p>" + esc(items[0]) + "</p>";
return '<ul class="bullets">' + items.map(function (it) { return "<li>" + esc(it) + "</li>"; }).join("") + "</ul>";
}
function bulletsCombinedHtml(texts) {
var items = [];
(texts || []).forEach(function (t) { items = items.concat(bulletItems(t)); });
if (!items.length) return "";
return '<ul class="bullets">' + items.map(function (it) { return "<li>" + esc(it) + "</li>"; }).join("") + "</ul>";
}
function parseStd(std) {
var OPEN = "【", CLOSE = "】";
var segs = [], rest = String(std || "");
while (rest) {
var o = rest.indexOf(OPEN);
if (o < 0) { if (rest.trim()) segs.push({ label: "", text: rest }); break; }
var c = rest.indexOf(CLOSE, o);
if (c < 0) { segs.push({ label: "", text: rest }); break; }
var after = rest.slice(c + 1);
var n = after.indexOf(OPEN);
segs.push({ label: rest.slice(o + 1, c), text: n < 0 ? after : after.slice(0, n) });
rest = n < 0 ? "" : after.slice(n);
}
if (!segs.length) return '<div class="seg"><p>' + esc(std) + "</p></div>";
return segs.map(function (p) {
var body = (p.label === "辦理歷程") ? bulletsHtml(p.text) : "<p>" + esc(p.text) + "</p>";
return '<div class="seg">' + (p.label ? '<b class="tag">' + esc(p.label) + "</b>" : "") + body + "</div>";
}).join("");
}
function block(title, inner, lead) {
if (!inner) return "";
return '<div class="block' + (lead? " lead": "") + '"><h3>' + esc(title) + '</h3><div class="body">' + inner + "</div></div>";
}
var sheetStack = [];
function restackSheets() {
sheetStack.forEach(function (sid, idx) {
var el = $("#" + sid); if (el) el.style.zIndex = String(60 + idx * 10);
});
}
function openSheet(id) {
var sh = $("#" + id);
var at = sheetStack.indexOf(id);
if (at >= 0) sheetStack.splice(at, 1);
sheetStack.push(id);
restackSheets();
sh.classList.add("open"); sh.scrollTop = 0;
document.body.style.overflow = "hidden";
}
function closeSheet() {
var id = sheetStack.pop();
if (id) { var el = $("#" + id); el.classList.remove("open"); el.style.zIndex = ""; }
restackSheets();
if (!sheetStack.length) document.body.style.overflow = "";
}
function openQuestion(id) {
var q = byId[id]; if (!q) return;
$("#qSheetWhere").textContent = q.topic;
var chips = '<span class="chip">' + miniCat(q.topic) + esc(q.topic) + "</span>" +
(q.pri === "高"? '<span class="chip pri-high">高關注</span>': "");
var tags = "";
if (q.region) tags += '<button type="button" class="tagchip" data-search="' + esc(q.region) + '">地區 · ' + esc(q.region) + "</button>";
if (q.project) tags += '<button type="button" class="tagchip" data-search="' + esc(q.project) + '">' + miniProj(q.project) + esc(q.project) + "</button>";
if (q.policy) tags += '<button type="button" class="tagchip" data-search="' + esc(q.policy) + '">政策 · ' + esc(q.policy) + "</button>";
legNames(q).forEach(function (n) {
if (legByName[n]) tags += '<button type="button" class="tagchip" data-lname="' + esc(n) + '">委員 · ' + esc(n) + "</button>";
else tags += '<span class="tagchip">委員 · ' + esc(n) + "</span>";
});
$("#qSheetBody").innerHTML =
'<div class="qtop" style="margin-top:16px">' + chips + "</div>" +
"<h1>" + esc(q.q) + "</h1>" +
(tags? '<div class="tags">' + tags + "</div>": "") +
block("一句話回應", esc(q.short), true) +
block("標準擬答", parseStd(q.std)) +
block("詳細說明", bulletsCombinedHtml([q.ext, q.data, q.risk])) +
block("禁用語", esc(q.forb)) +
'<p class="src">來源：' + esc(q.src) + "</p>";
openSheet("qSheet");
}
function openLegislator(name) {
var l = legByName[name]; if (!l) return;
var rel = relatedQs(name);
var rows = [];
if (l.party) rows.push(["黨籍", l.party]);
if (l.style) rows.push(["質詢風格", l.style]);
if (l.tactics) rows.push(["常見手法", l.tactics]);
if (l.notes) rows.push(["備註", l.notes]);
var html = "<h1>" + esc(l.name) + " 委員</h1>";
if (l.focus) html += block("關注議題", esc(l.focus), true);
rows.forEach(function (r) { html += block(r[0], esc(r[1]));});
if (!rows.length &&!l.focus) html += '<div class="empty">原始檔案未提供更多欄位。</div>';
html += '<div class="block"><h3>擬答（' + rel.length + '）</h3>' + (rel.length? '<p class="lede" style="margin:0 0 8px">點任一題目，即可看完整擬答內容。</p>': "") + '<div class="relq">' +
(rel.length? rel.map(function (q) { return qCard(q);}).join(""): '<div class="empty">尚無直接對應題目。</div>') +
"</div></div>";
$("#lSheetBody").innerHTML = html;
openSheet("lSheet");
}

/* ── 事件 ── */
document.addEventListener("click", function (e) {
var qc = e.target.closest("[data-qid]");
if (qc) { openQuestion(+qc.dataset.qid); return;}
var lc = e.target.closest("[data-lname]");
if (lc) { openLegislator(lc.dataset.lname); return;}
var sc = e.target.closest("[data-search]");
if (sc) {
sheetStack.slice().forEach(function () { closeSheet();});
var v = sc.dataset.search;
$("#searchInput").value = v;
$("#searchbox").classList.add("has-q");
doSearch(v);
return;
}
var ct = e.target.closest("[data-clear-topic]");
if (ct) { homeTopic = null; renderHome(); return;}
var gt = e.target.closest("[data-goto-topic]");
if (gt) {
homeTopic = (homeTopic === gt.dataset.gotoTopic)? null: gt.dataset.gotoTopic;
renderHome();
var hh = $("#hotHead"); if (hh) hh.scrollIntoView();
return;
}
var st = e.target.closest("[data-stat]");
if (st) {
if (st.dataset.stat === "people") { showTab("people"); return;}
homeTopic = null; renderHome(); showTab("home");
if (st.dataset.stat === "hot") { var hh2 = $("#hotHead"); if (hh2) hh2.scrollIntoView();}
return;
}
var cl = e.target.closest("[data-close]");
if (cl) { closeSheet(); return;}
});
$$(".tab").forEach(function (t) {
t.addEventListener("click", function () {
$("#searchInput").value = "";
$("#searchbox").classList.remove("has-q");
showTab(t.dataset.tab);
});
});
var searchTimer = null;
$("#searchInput").addEventListener("input", function (e) {
var v = e.target.value;
$("#searchbox").classList.toggle("has-q",!!v.trim());
clearTimeout(searchTimer);
searchTimer = setTimeout(function () { doSearch(v);}, 120);
});
$("#clearSearch").addEventListener("click", function () {
$("#searchInput").value = "";
$("#searchbox").classList.remove("has-q");
showTab(lastTab);
$("#searchInput").focus();
});
$("#homeBtn").addEventListener("click", function () {
while (sheetStack.length) closeSheet();
$("#searchInput").value = "";
$("#searchbox").classList.remove("has-q");
homeTopic = null; renderHome();
showTab("home");
});
document.addEventListener("keydown", function (e) {
if (e.key === "Escape" && sheetStack.length) closeSheet();
});

renderHome();
renderPeople();
})();
</script>
</body>
</html>
